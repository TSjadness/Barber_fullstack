/* Identidade premium e agenda inteligente */
:root{--gold:#d9b373;--gold2:#f4d49a;--line:#343130}
body{background:#101011;background-image:radial-gradient(ellipse at 84% 8%,#2c251b33,transparent 45%)}
.topbar{backdrop-filter:blur(20px);background:#111113ed}.topbar .brand{letter-spacing:.7px}.mark{border-radius:9px;box-shadow:0 0 0 4px #d9b37313}
.btn{transition:transform .2s,background .2s,border-color .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);filter:none;box-shadow:0 6px 28px #0003}.btn.primary{background:linear-gradient(115deg,#edc98d,#c79a52);box-shadow:0 6px 25px #c1974f19}
.public-hero{min-height:580px;background:linear-gradient(90deg,#08090afc 0%,#0b0b0be0 40%,#0b0b0b45 100%),url('https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=1800&q=85') center/cover}
.hero-inner{padding-top:90px;padding-bottom:90px}.hero-inner h1{font-size:clamp(52px,7vw,94px);line-height:1.02;letter-spacing:-3.8px;max-width:790px}
.hero-inner p{font-size:17px;line-height:1.9}.hero-ribbon{display:flex;gap:18px;flex-wrap:wrap;margin-top:42px;color:#ddd4c6;font-size:12px;font-weight:700}.hero-ribbon span{padding-left:15px;border-left:2px solid var(--gold)}
.public-hero:after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#caa46a,transparent)}
.service-card{background:linear-gradient(155deg,#242321,#171718 72%);border-color:#3b352c;padding:26px;min-height:240px;transition:transform .2s,border .2s,box-shadow .2s}.service-card:hover{transform:translateY(-5px);border-color:#bd945a;box-shadow:0 12px 50px #0005}.service-icon{display:grid;place-items:center;width:56px;height:56px;border-radius:15px;background:#d2a95b20;font-size:29px}.service-card h3{font-size:22px}.section-title h2{font-size:clamp(30px,4vw,43px)}.team-card{background:linear-gradient(125deg,#242320,#171718)}
.availability-legend{display:flex;flex-wrap:wrap;gap:13px;margin:16px 0 18px}.availability-legend span{font-size:12px;color:#c5c3bf;display:inline-flex;gap:7px;align-items:center}.availability-legend i{height:10px;width:10px;border-radius:50%;display:inline-block}
.date-button{min-height:83px;position:relative;border-radius:12px;transition:transform .15s,border .15s;gap:4px}.date-button small{font-size:9px;font-weight:800;white-space:nowrap}.date-button.available{background:#17382b;border-color:#3e9870;color:#aaf1c9}.date-button.partial{background:#443a18;border-color:#af9741;color:#ffdc86}.date-button.full{background:#482c1d;border-color:#c2793e;color:#ffba86}.date-button.closed{background:#442023;border-color:#bc525b;color:#ffa6ae}.date-button.selected{outline:2px solid var(--gold2);outline-offset:2px;box-shadow:0 0 0 3px #000}.date-button:disabled{opacity:.8;cursor:not-allowed}.date-button:hover:not(:disabled){transform:translateY(-3px)}
.modal-bg{backdrop-filter:blur(10px)}.confirm-layer{position:fixed;inset:0;z-index:250;background:#050505c9;backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px}.confirm-card{width:min(100%,470px);padding:38px 32px;text-align:center;border-radius:23px;background:linear-gradient(150deg,#282522,#151516);border:1px solid #6d5a3f;box-shadow:0 25px 90px #000c;animation:showUp .28s ease-out}.confirm-card h2{font-size:27px;margin:18px 0 10px}.confirm-card p{line-height:1.7}.confirm-card .summary-box{text-align:left;margin:18px 0 22px}.confirm-check{display:grid;place-items:center;width:85px;height:85px;border:2px solid #5ecb94;border-radius:50%;background:#143b2c;color:#76e6af;font-size:44px;margin:auto}.spinner{width:55px;height:55px;margin:15px auto 25px;border:4px solid #5a5042;border-top-color:var(--gold2);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes showUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.weekly-table{display:grid;gap:9px}.weekly-row{display:grid;grid-template-columns:80px minmax(130px,1fr) minmax(160px,1.3fr);gap:9px;align-items:center;background:#232323;border:1px solid #3a3938;padding:10px;border-radius:12px}.weekly-row strong{color:#e2d9cb}.weekly-row .hours-pair{display:flex;align-items:center;gap:6px}.weekly-row .hours-pair input{width:100%;padding:9px 5px}.weekly-row select{width:100%}.weekly-row.off{opacity:.65}.weekly-row.off .hours-pair{display:none}.hours-intro{background:#252017;border:1px solid #59442b;padding:15px 17px;border-radius:12px;color:#e6cfaa;margin-bottom:17px}.staff-schedule-card{border:1px solid var(--line);padding:22px;border-radius:16px;background:#1a1b1c;margin-bottom:16px}.staff-schedule-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:19px}.mini-days{display:flex;gap:6px;flex-wrap:wrap}.mini-days span{background:#3c3120;color:#efd19b;border:1px solid #6c512e;padding:5px 9px;border-radius:7px;font-size:11px}.mini-days span.off{background:#292426;border-color:#553437;color:#a88586}
@media(max-width:700px){.public-hero{min-height:580px;background-position:60% center}.hero-inner{padding:65px 22px}.hero-inner h1{font-size:clamp(46px,12vw,66px);letter-spacing:-2.8px}.hero-ribbon{gap:10px}.dates{grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.date-button{min-height:71px;padding:7px 1px}.date-button small{font-size:8px}.weekly-row{grid-template-columns:65px 1fr;gap:7px}.weekly-row .hours-pair{grid-column:1/-1}.confirm-card{padding:26px 20px}}

<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{let a=new Date(d);return `${a.getFullYear()}-${String(a.getMonth()+1).padStart(2,'0')}-${String(a.getDate()).padStart(2,'0')}`};const today=iso(new Date());const addDays=(date,n)=>{let d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};const pretty=date=>new Date(date+'T12:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const uid=()=>Math.random().toString(36).slice(2,10);const dayOf=date=>new Date(date+'T12:00:00').getDay();
let base={shop:{name:'Áureo Barber',tagline:'Tradição no corte. Excelência nos detalhes.',whatsapp:'',address:'Seu espaço, sua experiência.'},services:[{id:'s1',name:'Corte masculino',duration:30,price:40,icon:'✂️',active:true},{id:'s2',name:'Barba',duration:30,price:30,icon:'🪒',active:true},{id:'s3',name:'Cabelo + barba',duration:60,price:65,icon:'💈',active:true},{id:'s4',name:'Acabamento',duration:20,price:20,icon:'✨',active:true}],staff:[{id:'p1',name:'Lucas Oliveira',role:'Proprietário • Barbeiro',start:'09:00',end:'18:00',days:[1,2,3,4,5,6],active:true},{id:'p2',name:'Rafael Santos',role:'Barbeiro',start:'10:00',end:'19:00',days:[2,3,4,5,6],active:true}],bookings:[],notices:[{id:'n1',date:addDays(today,3),staffId:'all',type:'block',title:'Barbearia fechada',detail:'Não haverá atendimento nesta data.'}],payments:[]};
const demo=[['09:00','Mateus Lima','s1','p1','confirmado',0],['10:00','Pedro Costa','s3','p2','confirmado',0],['11:30','Bruno Alves','s2','p1','concluido',0],['14:00','André Souza','s3','p1','confirmado',0],['15:30','Caio Rocha','s1','p2','pendente',0],['16:00','Thiago Melo','s2','p1','confirmado',1],['10:30','Felipe Araújo','s3','p2','confirmado',2]];
base.bookings=demo.map((b,i)=>({id:'b'+i,date:addDays(today,b[5]),time:b[0],customer:b[1],phone:'',serviceId:b[2],staffId:b[3],status:b[4],paid:i===2,paymentMethod:i===2?'Pix':null}));
const API=window.__ENV__?.VITE_API_URL||'http://localhost:3333/api';
let db=structuredClone(base),token=sessionStorage.getItem('barberflow_token')||'',serverReady=false,writeQueue=Promise.resolve();
async function request(route,options={}){const response=await fetch(API+route,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...options.headers}});let payload;try{payload=await response.json()}catch{payload={}}if(!response.ok)throw new Error(payload.error||`Erro HTTP ${response.status}`);return payload}
async function refreshState(){db=await request(token?'/admin/state':'/public');serverReady=true;render()}
function save(){if(!token){toast('Faça login para editar dados.');return}const snapshot=JSON.stringify(db);writeQueue=writeQueue.then(()=>request('/admin/state',{method:'PUT',body:snapshot})).catch(async e=>{toast('Erro ao salvar: '+e.message);try{await refreshState()}catch{}});return writeQueue}
async function login(){const email=document.querySelector('#loginEmail')?.value,password=document.querySelector('#loginPassword')?.value;try{const data=await request('/login',{method:'POST',body:JSON.stringify({email,password})});token=data.token;sessionStorage.setItem('barberflow_token',token);await refreshState();view='admin';render()}catch(e){toast(e.message)}}
async function logout(){try{await request('/logout',{method:'POST'})}catch{}token='';sessionStorage.removeItem('barberflow_token');view='public';await refreshState()}
function loginPage(){return `<main style="max-width:440px;margin:70px auto;padding:25px"><div class="card"><span class="eyebrow">Acesso restrito</span><h1 style="margin-top:12px">Entrar na gestão</h1><p class="muted">Apenas o proprietário e administradores autorizados podem alterar a agenda.</p><form class="forms" onsubmit="event.preventDefault();login()"><label>E-mail<input type="email" id="loginEmail" required autocomplete="username" placeholder="seu@email.com"></label><label>Senha<input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Sua senha"></label><button class="btn primary" type="submit">Entrar no painel →</button></form></div></main>`}
let view='public',section='overview',date=today,step=1,flow={serviceId:null,staffId:null,date:null,time:null,customer:'',phone:''};
const service=id=>db.services.find(x=>x.id===id),staff=id=>db.staff.find(x=>x.id===id),occurs=(n,d,p)=>n.date===d&&(n.staffId==='all'||n.staffId===p),minutes=t=>Number(t.split(':')[0])*60+Number(t.split(':')[1]),clock=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');

const staffHours=(employee,d)=>employee.weekly?.[dayOf(d)]||{mode:employee.days.includes(dayOf(d))?"default":"closed",start:employee.start,end:employee.end};
const openSlots=(d,p,s,exclude)=>{let employee=staff(p),sv=service(s);if(!employee||!sv||!employee.active||staffHours(employee,d).mode==='closed'||closed(d,p))return [];let output=[];for(let m=minutes(staffHours(employee,d).mode==='custom'?staffHours(employee,d).start:employee.start);m+sv.duration<=minutes(staffHours(employee,d).mode==='custom'?staffHours(employee,d).end:employee.end);m+=10){let overlap=db.bookings.some(b=>b.id!==exclude&&b.date===d&&b.staffId===p&&b.status!=='cancelado'&&m<minutes(b.time)+(service(b.serviceId)?.duration||30)&&m+sv.duration>minutes(b.time));if(!overlap)output.push(clock(m))}return output};

erativo • Agendamentos e gestão integrados</footer>`}

function dayAvailability(d){let active=db.staff.filter(p=>p.active&&(flow.staffId==='any'||p.id===flow.staffId));let working=active.filter(p=>staffHours(p,d).mode!=='closed'&&!closed(d,p));if(!working.length)return {code:'closed',label:'Fechado'};let ids=working.map(p=>p.id),total=ids.reduce((a,id)=>a+openSlots(d,id,flow.serviceId).length,0);let available=ids.reduce((a,id)=>a+openSlots(d,id,flow.serviceId).filter(t=>d!==today||minutes(t)>new Date().getHours()*60+new Date().getMinutes()).length,0);if(!available)return {code:'full',label:'Lotado'};if(available<=Math.max(3,Math.floor(total*.28)))return {code:'partial',label:'Poucas vagas'};return {code:'available',label:'Livre'} }

function editService(id){let s=service(id)||{name:'',duration:30,price:40,icon:'✂️',active:true};modal(id?'Editar serviço':'Novo serviço',`<form class="forms" onsubmit="event.preventDefault();saveService('${id||''}')"><label>Nome<input id="fName" required value="${esc(s.name)}"></label><div class="form-row"><label>Duração em minutos<input id="fDuration" type="number" min="10" step="10" required value="${s.duration}"></label><label>Valor (R$)<input id="fPrice" type="number" min="0" step="0.01" required value="${s.price}"></label></div><label>Emoji / ícone<input id="fIcon" value="${esc(s.icon)}"></label><label class="toggle"><input id="fActive" type="checkbox" ${s.active?'checked':''}> Serviço ativo e visível no site</label><button class="btn primary" type="submit">Salvar serviço</button></form>`)}function saveService(id){let data={id:id||uid(),name:$('#fName').value.trim(),duration:+$('#fDuration').value,price:+$('#fPrice').value,icon:$('#fIcon').value||'✂️',active:$('#fActive').checked};if(!data.name||data.duration<10)return toast('Confira os dados do serviço.');if(id)Object.assign(service(id),data);else db.services.push(data);save();closeModal();render();toast('Serviço atualizado no site!')}

function saveEditedBooking(id){const b=db.bookings.find(x=>x.id===id);if(!b)return;const updated={...b,customer:$('#editCustomer').value.trim(),phone:$('#editPhone').value.trim(),date:$('#editDate').value,time:$('#editTime').value,serviceId:$('#editService').value,staffId:$('#editStaff').value};if(updated.customer.length<3)return toast('Informe o nome do cliente');if(updated.date<today)return toast('Selecione uma data válida');const p=staff(updated.staffId),srv=service(updated.serviceId);if(!p||!srv)return toast('Profissional ou serviço inválido');const a=minutes(updated.time),h=staffHours(p,updated.date);let start=h.mode==='custom'?h.start:p.start,end=h.mode==='custom'?h.end:p.end;if(h.mode==='closed'||closed(updated.date,p)||a<minutes(start)||a+srv.duration>minutes(end))return toast('Horário fora do expediente ou bloqueado');if(db.bookings.some(x=>x.id!==id&&x.status!=='cancelado'&&x.date===updated.date&&x.staffId===updated.staffId&&a<minutes(x.time)+(service(x.serviceId)?.duration||30)&&a+srv.duration>minutes(x.time)))return toast('Existe outro atendimento nesse horário');Object.assign(b,updated);save();closeModal();render();toast('Agendamento editado!')}
function exportFinance(){const cols=['ID','Data','Hora','Cliente','Telefone','Serviço','Profissional','Valor (R$)','Status','Pago','Forma pagamento'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';const rows=db.bookings.map(b=>[b.id,b.date,b.time,b.customer,b.phone,service(b.serviceId)?.name||'',staff(b.staffId)?.name||'',(service(b.serviceId)?.price||0).toFixed(2).replace('.',','),b.status,b.paid?'Sim':'Não',b.paymentMethod||'']);const csv='\ufeff'+[cols,...rows].map(row=>row.map(quote).join(';')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='barberflow-financeiro-'+today+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Planilha exportada. Abre no Excel.')}function importFinance(){modal('Importar planilha',`<div class="forms"><p class="muted">Importe arquivos CSV exportados pelo BarberFlow. Para segurança, a importação oferece uma prévia antes de alterar dados.</p><label>Arquivo CSV<input type="file" id="financeFile" accept=".csv,text/csv"></label><button class="btn primary" onclick="previewFinanceImport()">Analisar arquivo</button></div>`)}
